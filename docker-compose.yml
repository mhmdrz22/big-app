version: "3.9"

services:
  web:
    build: .
    command: uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./instance:/app/instance
    env_file: .env
    restart: unless-stopped

  worker:
    build: .
    command: python scripts/run_worker.py
    volumes:
      - .:/app
      - ./instance:/app/instance
    env_file: .env
    restart: unless-stopped
